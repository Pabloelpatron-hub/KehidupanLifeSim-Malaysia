
name: Deploy Game ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Game version (optional, e.g. 16.7)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate game
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          ROOT = Path(".")
          SITE = Path("_site")

          PATTERNS = [
              re.compile(
                  r"^Kehidupan_LifeSim_v"
                  r"(?P<version>\d+(?:\.\d+)*)"
                  r"_Part(?P<part>\d+)of(?P<total>\d+)"
                  r"\.zip$",
                  re.IGNORECASE
              ),
              re.compile(
                  r"^LifeSim_v"
                  r"(?P<major>\d+)_(?P<minor>\d+)"
                  r"_AudioFix_7Parts_"
                  r"(?P<part>\d+)of(?P<total>\d+)"
                  r"\.zip$",
                  re.IGNORECASE
              ),
              re.compile(
                  r"^LifeSim_v"
                  r"(?P<major>\d+)_(?P<minor>\d+)"
                  r"_SMALL_"
                  r"(?P<part>\d+)of(?P<total>\d+)"
                  r"\.zip$",
                  re.IGNORECASE
              ),
          ]

          groups = {}

          for file in ROOT.iterdir():
              if not file.is_file():
                  continue

              for pattern in PATTERNS:
                  match = pattern.fullmatch(file.name)

                  if not match:
                      continue

                  data = match.groupdict()

                  if data.get("version"):
                      version = data["version"]
                  else:
                      version = (
                          f"{data['major']}."
                          f"{data['minor']}"
                      )

                  part = int(data["part"])
                  total = int(data["total"])

                  groups.setdefault(version, []).append(
                      (part, total, file)
                  )
                  break

          if not groups:
              raise SystemExit(
                  "No split game ZIP packages found."
              )

          requested = os.environ.get(
              "REQUESTED_VERSION", ""
          ).strip()

          if requested:
              if requested not in groups:
                  raise SystemExit(
                      f"Version {requested} not found. "
                      f"Available: {sorted(groups)}"
                  )
              version = requested
          else:
              version = max(
                  groups,
                  key=lambda v: tuple(
                      int(x) for x in v.split(".")
                  )
              )

          entries = groups[version]
          totals = {total for _, total, _ in entries}

          if len(totals) != 1:
              raise SystemExit(
                  "Inconsistent package totals for "
                  f"version {version}."
              )

          expected_total = totals.pop()

          if expected_total < 1:
              raise SystemExit(
                  "Invalid package count."
              )

          numbers = [part for part, _, _ in entries]

          if (
              len(numbers) != expected_total
              or sorted(numbers) != list(
                  range(1, expected_total + 1)
              )
          ):
              raise SystemExit(
                  "Incomplete or duplicate ZIP parts. "
                  f"Expected 1 through {expected_total}; "
                  f"found {sorted(numbers)}"
              )

          packages = [
              file for _, _, file in
              sorted(entries, key=lambda x: x[0])
          ]

          print("Selected version:", version)
          print("Package count:", len(packages))

          for package in packages:
              print("Package:", package.name)

          if SITE.exists():
              shutil.rmtree(SITE)

          SITE.mkdir()

          seen = set()
          total_files = 0
          total_bytes = 0

          for package in packages:
              print("Extracting:", package.name)

              with zipfile.ZipFile(package) as archive:
                  bad = archive.testzip()

                  if bad:
                      raise ValueError(
                          f"Corrupt ZIP {package}: {bad}"
                      )

                  for entry in archive.infolist():
                      raw = entry.filename.replace(
                          "\\", "/"
                      )

                      path = PurePosixPath(raw)

                      if (
                          not raw
                          or raw.startswith("/")
                          or ".." in path.parts
                          or ":" in path.parts[0]
                          or any(
                              part == "."
                              for part in raw.split("/")
                          )
                      ):
                          raise ValueError(
                              f"Unsafe ZIP path: {raw}"
                          )

                      mode = entry.external_attr >> 16

                      if stat.S_ISLNK(mode):
                          raise ValueError(
                              f"Symlink forbidden: {raw}"
                          )

                      if entry.is_dir():
                          continue

                      name = path.as_posix()

                      if name in seen:
                          raise ValueError(
                              f"Duplicate file: {name}"
                          )

                      seen.add(name)

                      total_files += 1
                      total_bytes += entry.file_size

                      if (
                          total_files > 50000
                          or total_bytes > 2 * 1024**3
                      ):
                          raise ValueError(
                              "Safety limit exceeded."
                          )

                      target = SITE.joinpath(*path.parts)

                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      with archive.open(entry) as src:
                          with target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

          index = SITE / "index.html"

          if not index.is_file():
              dirs = [
                  p for p in SITE.iterdir()
                  if p.is_dir()
              ]

              files = [
                  p for p in SITE.iterdir()
                  if p.is_file()
              ]

              if (
                  len(dirs) == 1
                  and not files
                  and (dirs[0] / "index.html").is_file()
              ):
                  folder = dirs[0]

                  for item in list(folder.iterdir()):
                      shutil.move(
                          str(item),
                          str(SITE / item.name)
                      )

                  folder.rmdir()

          if not (SITE / "index.html").is_file():
              raise ValueError(
                  "index.html missing from game root."
              )

          if not (SITE / "assets").is_dir():
              raise ValueError(
                  "assets directory missing."
              )

          print("Validation passed.")
          print("Version:", version)
          print("ZIP packages:", len(packages))
          print("Files extracted:", total_files)
          print("Extracted bytes:", total_bytes)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
