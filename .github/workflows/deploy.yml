
name: Deploy Game ZIP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (atau latest)"
        required: true
        default: "v17.0-ui-fix"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and validate release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          mkdir -p _download

          if [ "$RELEASE_TAG" = "latest" ]; then
            gh release download \
              --repo "$GH_REPO" \
              --pattern "*.zip" \
              --dir _download
          else
            gh release download "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --pattern "*.zip" \
              --dir _download
          fi

          python3 - <<'PY'
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          downloads = list(Path("_download").glob("*.zip"))

          if len(downloads) != 1:
              raise SystemExit(
                  f"Expected exactly one ZIP, found {len(downloads)}"
              )

          package = downloads[0]
          site = Path("_site")
          site.mkdir(exist_ok=True)

          max_files = 50000
          max_bytes = 2 * 1024**3

          seen = set()
          total_files = 0
          total_bytes = 0

          with zipfile.ZipFile(package) as archive:
              bad = archive.testzip()

              if bad:
                  raise ValueError(
                      f"Corrupt ZIP entry: {bad}"
                  )

              for entry in archive.infolist():
                  raw = entry.filename.replace("\\", "/")
                  path = PurePosixPath(raw)

                  if (
                      not raw
                      or raw.startswith("/")
                      or ".." in path.parts
                      or ":" in path.parts[0]
                      or any(
                          part in ("", ".")
                          for part in raw.rstrip("/").split("/")
                      )
                  ):
                      raise ValueError(
                          f"Unsafe ZIP path: {raw}"
                      )

                  mode = entry.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise ValueError(
                          f"Symlink forbidden: {raw}"
                      )

                  if entry.is_dir():
                      continue

                  name = path.as_posix()

                  if name in seen:
                      raise ValueError(
                          f"Duplicate file: {name}"
                      )

                  seen.add(name)
                  total_files += 1
                  total_bytes += entry.file_size

                  if (
                      total_files > max_files
                      or total_bytes > max_bytes
                  ):
                      raise ValueError(
                          "Extraction limit exceeded"
                      )

                  target = site.joinpath(*path.parts)
                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  with archive.open(entry) as src:
                      with target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)

          if not (site / "index.html").is_file():
              dirs = [p for p in site.iterdir() if p.is_dir()]
              files = [p for p in site.iterdir() if p.is_file()]

              if (
                  len(dirs) == 1
                  and not files
                  and (dirs[0] / "index.html").is_file()
              ):
                  folder = dirs[0]
                  for item in list(folder.iterdir()):
                      shutil.move(str(item), str(site / item.name))
                  folder.rmdir()

          if not (site / "index.html").is_file():
              raise ValueError(
                  "Game index.html missing"
              )

          if not (site / "assets").is_dir():
              raise ValueError(
                  "Game assets directory missing"
              )

          (site / ".nojekyll").touch()

          print("VALIDATION PASSED")
          print("Package:", package.name)
          print("Files:", total_files)
          print("Bytes:", total_bytes)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
