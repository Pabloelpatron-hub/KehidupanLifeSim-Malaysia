
name: Deploy Game ZIP

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and validate full game
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          SOURCE = Path("deploy-packages")
          SITE = Path("_site")
          MAX_FILES = 50000
          MAX_SIZE = 2 * 1024**3

          if not SOURCE.is_dir():
              raise SystemExit(
                  "Missing deploy-packages folder."
              )

          packages = sorted(
              p for p in SOURCE.iterdir()
              if p.is_file()
              and p.suffix.lower() == ".zip"
          )

          if not packages:
              raise SystemExit(
                  "No ZIP packages found."
              )

          print(f"Found {len(packages)} ZIP packages")

          if SITE.exists():
              shutil.rmtree(SITE)

          SITE.mkdir()

          seen = set()
          total_size = 0
          total_files = 0

          for package in packages:
              print(f"Extracting: {package.name}")

              with zipfile.ZipFile(package) as archive:
                  bad = archive.testzip()

                  if bad:
                      raise ValueError(
                          f"Corrupt ZIP: {package.name}: {bad}"
                      )

                  for entry in archive.infolist():
                      raw = entry.filename.replace("\\", "/")
                      path = PurePosixPath(raw)

                      if (
                          not raw
                          or raw.startswith("/")
                          or any(
                              part in ("", ".", "..")
                              for part in raw.split("/")
                              if part != ""
                          )
                          or ".." in path.parts
                          or ":" in path.parts[0]
                      ):
                          raise ValueError(
                              f"Unsafe ZIP path: {raw}"
                          )

                      mode = entry.external_attr >> 16

                      if stat.S_ISLNK(mode):
                          raise ValueError(
                              f"Symlink forbidden: {raw}"
                          )

                      if entry.is_dir():
                          continue

                      if path.as_posix() in seen:
                          raise ValueError(
                              f"Duplicate file: {raw}"
                          )

                      seen.add(path.as_posix())
                      total_files += 1
                      total_size += entry.file_size

                      if (
                          total_files > MAX_FILES
                          or total_size > MAX_SIZE
                      ):
                          raise ValueError(
                              "Deployment safety limit exceeded"
                          )

                      target = SITE.joinpath(*path.parts)

                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      with archive.open(entry) as src:
                          with target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

          index = SITE / "index.html"

          if not index.is_file():
              dirs = [
                  p for p in SITE.iterdir()
                  if p.is_dir()
              ]
              files = [
                  p for p in SITE.iterdir()
                  if p.is_file()
              ]

              if (
                  len(dirs) == 1
                  and not files
                  and (dirs[0] / "index.html").is_file()
              ):
                  folder = dirs[0]

                  for item in list(folder.iterdir()):
                      shutil.move(
                          str(item),
                          str(SITE / item.name)
                      )

                  folder.rmdir()

          if not (SITE / "index.html").is_file():
              raise ValueError(
                  "index.html missing at website root"
              )

          if not (SITE / "assets").is_dir():
              raise ValueError(
                  "assets folder missing"
              )

          music = SITE / "assets/audio/destinations"

          if music.is_dir():
              tracks = list(music.glob("*.mp3"))
              print(f"Destination MP3: {len(tracks)}")

              if len(tracks) not in (0, 30):
                  raise ValueError(
                      "Incomplete destination soundtrack set"
                  )

          print("Deployment validation passed")
          print(f"ZIP packages: {len(packages)}")
          print(f"Files: {total_files}")
          print(f"Extracted bytes: {total_size}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
