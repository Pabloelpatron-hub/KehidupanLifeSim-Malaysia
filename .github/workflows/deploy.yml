
name: Deploy Game ZIP

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release name"
        required: true
        default: "UI_Fix"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate game
        shell: bash
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          ROOT = Path(".")
          SITE = Path("_site")

          RELEASE = os.environ.get(
              "REQUESTED_RELEASE", ""
          ).strip()

          if not RELEASE:
              raise SystemExit(
                  "Release name is required."
              )

          if not re.fullmatch(
              r"[A-Za-z0-9_.-]+", RELEASE
          ):
              raise SystemExit(
                  "Invalid release name."
              )

          PATTERN = re.compile(
              r"^LifeSim_v"
              r"(?P<major>\d+)_(?P<minor>\d+)_"
              r"(?P<release>[A-Za-z0-9_.-]+)_"
              r"(?P<part>\d+)of(?P<total>\d+)"
              r"(?:\(\d+\))?"
              r"\.zip$",
              re.IGNORECASE
          )

          groups = {}

          for file in ROOT.iterdir():
              if not file.is_file():
                  continue

              match = PATTERN.fullmatch(file.name)

              if not match:
                  continue

              data = match.groupdict()

              version = (
                  f"{data['major']}.{data['minor']}"
              )

              release = data["release"]
              part = int(data["part"])
              total = int(data["total"])

              key = (version, release.lower())

              groups.setdefault(key, []).append(
                  (part, total, file)
              )

          matching = [
              key for key in groups
              if key[1] == RELEASE.lower()
          ]

          if not matching:
              raise SystemExit(
                  f"Release '{RELEASE}' not found. "
                  f"Available: {sorted(groups)}"
              )

          selected = max(
              matching,
              key=lambda key: tuple(
                  int(x) for x in key[0].split(".")
              )
          )

          version, release = selected
          entries = groups[selected]

          totals = {
              total for _, total, _ in entries
          }

          if len(totals) != 1:
              raise SystemExit(
                  "Inconsistent ZIP package totals."
              )

          expected_total = totals.pop()

          if expected_total < 1:
              raise SystemExit(
                  "Invalid package count."
              )

          numbers = [
              part for part, _, _ in entries
          ]

          if (
              len(numbers) != expected_total
              or sorted(numbers) != list(
                  range(1, expected_total + 1)
              )
          ):
              raise SystemExit(
                  "Incomplete or duplicate ZIP parts. "
                  f"Expected 1 to {expected_total}; "
                  f"found {sorted(numbers)}"
              )

          packages = [
              file for _, _, file in
              sorted(entries, key=lambda x: x[0])
          ]

          print("Selected version:", version)
          print("Selected release:", release)
          print("Package count:", len(packages))

          for package in packages:
              print("Package:", package.name)

          if SITE.exists():
              shutil.rmtree(SITE)

          SITE.mkdir()

          seen = set()
          total_files = 0
          total_bytes = 0

          MAX_FILES = 50000
          MAX_BYTES = 2 * 1024**3

          for package in packages:
              print("Extracting:", package.name)

              with zipfile.ZipFile(package) as archive:
                  bad = archive.testzip()

                  if bad:
                      raise ValueError(
                          f"Corrupt ZIP {package}: {bad}"
                      )

                  for entry in archive.infolist():
                      raw = entry.filename.replace(
                          "\\", "/"
                      )

                      path = PurePosixPath(raw)

                      if (
                          not raw
                          or raw.startswith("/")
                          or ".." in path.parts
                          or ":" in path.parts[0]
                          or any(
                              part in ("", ".")
                              for part in raw.rstrip("/").split("/")
                          )
                      ):
                          raise ValueError(
                              f"Unsafe ZIP path: {raw}"
                          )

                      mode = entry.external_attr >> 16

                      if stat.S_ISLNK(mode):
                          raise ValueError(
                              f"Symlink forbidden: {raw}"
                          )

                      if entry.is_dir():
                          continue

                      name = path.as_posix()

                      if name in seen:
                          raise ValueError(
                              f"Duplicate file: {name}"
                          )

                      seen.add(name)

                      total_files += 1
                      total_bytes += entry.file_size

                      if (
                          total_files > MAX_FILES
                          or total_bytes > MAX_BYTES
                      ):
                          raise ValueError(
                              "Safety limit exceeded."
                          )

                      target = SITE.joinpath(
                          *path.parts
                      )

                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      with archive.open(entry) as src:
                          with target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

          index = SITE / "index.html"

          if not index.is_file():
              dirs = [
                  p for p in SITE.iterdir()
                  if p.is_dir()
              ]

              files = [
                  p for p in SITE.iterdir()
                  if p.is_file()
              ]

              if (
                  len(dirs) == 1
                  and not files
                  and (dirs[0] / "index.html").is_file()
              ):
                  folder = dirs[0]

                  for item in list(folder.iterdir()):
                      shutil.move(
                          str(item),
                          str(SITE / item.name)
                      )

                  folder.rmdir()

          if not (SITE / "index.html").is_file():
              raise ValueError(
                  "index.html missing from game root."
              )

          if not (SITE / "assets").is_dir():
              raise ValueError(
                  "assets directory missing."
              )

          print("==============================")
          print("VALIDATION PASSED")
          print("==============================")
          print("Version:", version)
          print("Release:", release)
          print("ZIP packages:", len(packages))
          print("Files extracted:", total_files)
          print("Extracted bytes:", total_bytes)
          print("==============================")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
